<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Envelope Budgeter</title>
  </head>

  <body>
    <main>
      <h1>Envelope Budgeter</h1>
      <div class="container">
        <!-- novalidate: our JavaScript does the validation so every message
             looks the same and nothing depends on browser-specific popups. -->
        <form id="budget-form" novalidate>
          <label for="income">Total Monthly Income</label>
          <input
            type="text"
            inputmode="decimal"
            autocomplete="off"
            id="income"
            placeholder="e.g. 2000"
            aria-describedby="amount-hint"
            required
          />
          <p id="amount-hint" class="hint">
            Enter plain numbers such as 25 or 25.50 (no negatives, commas or
            scientific notation).
          </p>

          <fieldset id="rent">
            <legend>Rent</legend>
            <label for="rent-amount">Amount</label>
            <input
              type="text"
              inputmode="decimal"
              autocomplete="off"
              id="rent-amount"
              placeholder="e.g. 1000"
              aria-describedby="amount-hint"
            />
          </fieldset>

          <fieldset id="food">
            <legend>Food</legend>
            <div class="input-container"></div>
          </fieldset>

          <fieldset id="utilities">
            <legend>Utilities</legend>
            <div class="input-container"></div>
          </fieldset>

          <fieldset id="entertainment">
            <legend>Entertainment</legend>
            <div class="input-container"></div>
          </fieldset>

          <div class="controls">
            <span>
              <label for="entry-dropdown">Add expense to:</label>
              <select id="entry-dropdown" name="options">
                <option value="food" selected>Food</option>
                <option value="utilities">Utilities</option>
                <option value="entertainment">Entertainment</option>
              </select>
              <button type="button" id="add-entry">Add Entry</button>
            </span>
          </div>

          <div>
            <button type="submit">Calculate Remaining Budget</button>
            <button type="button" id="clear">Clear</button>
          </div>

          <div
            id="error-summary"
            class="error-summary hide"
            role="alert"
            tabindex="-1"
          ></div>
        </form>

        <div
          id="output"
          class="output hide"
          role="status"
          aria-live="polite"
        ></div>
      </div>
    </main>
    <script src="./script.js" defer></script>
  </body>
</html>
